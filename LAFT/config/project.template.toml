# LAFT per-project configuration — TEMPLATE
#
# To start a new project: copy this file to <your-project>/config/project.toml
# and fill in every value marked TODO. See docs/NEW_PROJECT_CHECKLIST.md for
# the full instantiation steps (what to copy, what to hand-port, how to verify).
#
# Paths are relative to the project root (the directory containing config/),
# and the pipeline tools must be run from that root:
#     python tools/phase01_01_ts_parse.py            # uses this config
#     python tools/phase02_01_procs_JSON.py --config path/to/project.toml
#
# The Kessler instance (../kessler/config/project.toml) is a fully worked
# example.

[project]
name = "TODO-scheme-name"          # used in report headers (e.g. "Kessler")

[source]
# Fortran source file(s) parsed by phase01. One or many — a multi-file list is
# parsed into a single merged out/phase1_index.json.
fortran_files = ["data/src/TODO_your_scheme.f90"]
# Root of all generated pipeline artifacts (subdirectory layout is framework
# convention: procedures/, packets/, prompts/, jax/, bridge/, lint/, ...)
out_root = "out"

[reference]
dir           = "TODO-reference-dir"   # reference Fortran driver tree
driver_source = "TODO_driver.f90"      # the driver your JAX driver must mirror
output_file   = "TODO_out_ref.dat"     # reference output for [comparison].script

[driver]
# The JAX driver is hand-ported from [reference].driver_source — same inputs,
# same outputs, same output file format. It is NOT generated by the pipeline.
script       = "out/driver/TODO_jax_driver.py"
output_file  = "out/driver/TODO_out_jax.dat"
summary_json = "out/driver/TODO_driver.json"
# Bridge-contract declaration — the project's DECISION RECORD (see
# workflow_bridge/BRIDGE_WORKFLOW.md §Two bridge contracts and
# TRANSLATE_WORKFLOW.md Step 5). Which contract(s) the application uses:
#   1 = host contract (`<proc>_bridge`: NumPy in/out, transfers per call)
#   2 = device-resident (`<proc>_bridge_device`: jax.Arrays stay on device;
#       the driver must implement the LAFT_DRIVER_MODE=host|device_resident
#       switch — frozen framework convention, reference implementation
#       ../kessler/out/driver/kessler_jax_driver.py)
# Stage 2 runs driver + comparison once per listed contract; its gate is
# ALL PASS in EVERY listed one. Lifecycle:
#   [1, 2] = UNDECIDED (new-project default) — exercise both until the
#            project's benchmark decides which one the application should use;
#   a single value = PINNED. Pin manually (never by a tool) and record
#   provenance, e.g.:
#     contracts = [2]  # pinned 2026-08-21, <path of the compared report>
#   Re-open the decision by restoring [1, 2] (e.g. after an optimization
#   that changes the kernel-vs-data-movement ratio).
# Projects with no driver yet keep the default; the per-mode certification
# skips until a driver exists. Key absent = [1] (host-only, pre-2026-08
# behavior).
contracts = [1, 2]

[comparison]
# Project comparison script — the FOURTH hand-made input, twin of
# [driver].script. Comparison is inherently project-specific: the output
# format and pass criteria follow the project's reference Fortran driver, so
# each project writes its own script (worked example:
# ../kessler/out/driver/kessler_compare_fortran_jax.py — per-variable text
# files, max-abs-error tolerances).
#
# Framework contract (enforced by pbsJobs/jax_gpu_compvalues.sh):
#   - the job runs this script from the project root
#   - exit 0 = PASS, non-zero = FAIL (the PBS log is authoritative)
#   - the script writes a human-readable report + a JSON with a top-level
#     PASS/FAIL status next to the JAX driver output
# Any further keys in this section are private to the project's script
# (e.g. a block_rows/columns/tolerance schema).
script = "out/driver/TODO_compare.py"

[prompts]
policies_dir = "workflow_translator/prompt_policies"
# Project-specific policy files appended to Pass-1 prompts. Write one for your
# scheme's hot loops / lookup-table idioms / key constants, or leave the
# list empty.
project_policies = []
# Argument names that trigger inclusion of error_policy.md
error_arg_names = ["errmsg", "errflg"]

[semantic_audit]
# Project-specific audit gates; leave empty to run only the generic checks
# (zero-forever, intent-out, constant set-diffs).
# "lut_indices": for schemes driven by multi-column lookup tables — set
#   lut_pattern to the Fortran accessor prefix (e.g. "proc_from_LUT_").
# "level_conventions": flags level-direction convention claims in docstrings.
enabled_checks = []
lut_pattern = ""
level_convention_names = []
# "prognostic_vars": update-terms check — for each listed variable, every term
#   of the Fortran `x = x ± (...)` update must appear in the translation's update
#   of x (FAIL). Use "fortran:python" when the translation renames the local
#   (e.g. "qitot:qit"). Leave empty for schemes without tendency-style updates.
prognostic_vars = []
# "table_readers": table-reads check — executes the translation's lookup-table
#   reader on the real file (numpy only) and compares with the Fortran
#   `read(...) dum,…, tab(...,1) … tab(...,N)` statement: column base slot 0,
#   N columns, leading-token skip, loop nesting order. One [[...]] block per
#   reader; omit for schemes without lookup tables.
# [[semantic_audit.table_readers]]
# proc = "xyz_init"                   # procedure that owns the reader
# function = "_read_table1"           # reader function in out/jax/<proc>.py
# result_index = 0                    # which element if it returns a tuple
# file = "data/lookup_tables/table1.dat"
# fortran_read = "itab(jj,ii,ll,i,"   # item prefix in the Fortran read statement
# header_lines = 1

[runtime_validation]              # phase05_02 synthetic-input overrides (optional)
# Argument values the standalone runtime check must use instead of the
# type-derived dummies (CHARACTER args default to "", integer scalars to
# DUMMY_N, arrays to uniform 1.0). Use it only when the uniform dummies make
# the *Fortran* itself undefined (division by zero, unreadable table set).
#   string containing "/"  -> path relative to the project root
#   "ramp:<step>"          -> array decreasing along the last Fortran axis
#                             (step*(n..1); e.g. heights with kbot = nk)
#   number / bool          -> scalar, broadcast to the argument's declared shape
# Scope "*" applies to every procedure; a procedure-named scope to that one.
# [runtime_validation.arg_values."*"]
# lookup_file_dir = "reference/lookup_tables"     # an init routine that opens table files
# [runtime_validation.arg_values.my_init_proc]
# ncat = 1                                        # only the shipped tables are readable

[heuristics]
# Argument names never treated as data outputs (dimension/size arguments).
dim_names = [
  "n", "m", "k", "nn", "mm", "kk",
  "nx", "ny", "nz", "ndim", "dim", "dims",
  "rows", "cols", "nrows", "ncols",
  "lda", "ldb", "ldc", "ld", "stride", "strides",
  "size", "sizes", "len", "length",
]
# Scalar status-flag names (plus the built-in "is*" prefix rule).
# Scalars that vary every call (timestep counters, sim time) — never
# jit-static: a per-step static recompiles the kernel every step.
# Defaults built into framework_config: it, kount, itimestep, istep.
per_step_scalar_names = []
scalar_flag_names = [
  "isok", "is_ok", "ok",
  "info", "ierr", "errno", "status",
  "success", "flag", "failed", "error",
  "converged",
]
# Loop-index name hints used by the phase03 loop-swap analyzer
column_indicators = ["COL", "ICOL", "I", "N"]
level_indicators  = ["K", "LEV", "KLEV", "KK", "ILEV"]

[hpc]
# Account, queue, conda env, and modules are set directly in the #PBS headers
# of the pbsJobs/*.sh scripts — edit them there. Submit all jobs from the
# project root: the scripts cd to $PBS_O_WORKDIR.
# The generic driver pair reads [driver].script from this file — no rename
# needed; only override these if the project ships custom driver jobs.
# driver_job is the validation driver: it runs on GPU (the deployment target),
# matching the GPU runtime-validation and comparison jobs. driver_job_cpu is an
# optional CPU cross-check only, not part of the validation gate.
driver_job      = "pbsJobs/jax_driver_gpu.sh"   # driver validation runs on GPU
driver_job_cpu  = "pbsJobs/jax_driver.sh"       # optional CPU cross-check only
driver_job_name = "jaxdrvgpu"     # #PBS -N in driver_job (log = <name>.o<id>)

[hardware]                        # phase03 performance advisor
gpu_name               = "Derecho A100"
pcie_bandwidth_gbs     = 50
gpu_mem_bandwidth_gbs  = 1200
gpu_compute_tflops     = 9.7
gpu_launch_overhead_us = 15
gpu_transfer_setup_us  = 30

[llm]                             # tools/copy_AI_results.sh targets
copy_targets = ["claude", "gpt", "gemini", "qwen"]

[translator]                      # TRANSLATE_WORKFLOW.md Step 2 — who authors
                                  # the INITIAL translation (repair is always
                                  # the driving agent's, regardless of source)
# "in_context" (or section absent): the driving agent translates the passes
# itself. Any other value: the agent follows the module doc for Step 2 only,
# and the remaining four keys must be set.
source            = "in_context"
llm_label         = "TODO — e.g. Claude Fable 5 (claude-fable-5)"
# --- qwen: local Qwen2.5-Coder-32B-Instruct via vLLM on PBS (the paper-1
#     configuration; see workflow_translator/qwen/qwen.md) ---
# source            = "qwen"
# module            = "workflow_translator/qwen/qwen.md"
# llm_label         = "Qwen2.5-32B (Qwen2.5-Coder-32B-Instruct via vLLM)"
# pbs_translate_job      = "pbsJobs/pbs_qwen25_translate.sh"
# pbs_translate_job_name = "qwen25_translate"   # #PBS -N (log = <name>.o<id>)

[profiler]                        # workflow_profiler/ — see PROFILE_WORKFLOW.md
target_proc   = "TODO"                          # procedure to profile
staged_code   = "out/profiled/TODO.py"          # working copy the loop iterates on
out_dir       = "out/profiled"
# Real-state capture: the profiler intercepts this driver's bridge call at
# capture_minute and caches the full argument state (driver never modified).
driver_module = "out/driver/TODO_jax_driver.py"
bridge_module = "out.bridge.TODO_bridge"
bridge_func   = "TODO_bridge"
capture_minute = 45.0             # pick a physically active mid-run time
state_cache   = "out/profiled/TODO_state.pkl"
# Column tiling: captured single-column state replicated to ncol; noise on
# the prognostic fields; scalar args in ncol_args set to ncol.
ncol            = 1000
ncol_check      = 100             # second point for the scaling gates
n_calls         = 10
noise_amplitude = 0.10
noise_fields    = []              # TODO: prognostic field names to perturb
ncol_args       = []              # TODO: e.g. ["ite"] — scalars meaning "last column"
nvtx_label      = "TODO_profiled_calls"
profile_trace_job = "pbsJobs/jax_gpu_profile_trace.sh"
profile_nsys_job  = "pbsJobs/jax_gpu_profile_nsys.sh"

[bridge]                          # module-var signature policy (phase03/04/05)
# Module vars dropped from every generated signature project-wide: judgment
# calls the dependency analysis cannot make (e.g. error-status globals the
# translations handle internally). Default: none.
exclude_module_vars = []

[bridge.optional_kwargs]          # phase03: per-procedure pass-through kwargs
# Optional: vars listed here (per procedure) are emitted as None-default
# kwargs in the bridge signature (None = stub mode), forwarded to the wrapper
# as keywords, and never returned. Use for heavy resources like lookup tables
# so tests can run without loading them. The list is authoritative — it may
# name vars the dependency analysis missed. Omit or leave empty if unused.
# <proc_name> = ["table_a", "table_b"]
